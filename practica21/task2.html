<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор скидки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .container {
            max-width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        input, button {
            margin: 10px 0;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Калькулятор скидки</h2>
        
        <label>Стоимость товара:</label>
        <input type="number" id="price" placeholder="Введите цену">
        
        <label>Возраст покупателя:</label>
        <input type="number" id="age" placeholder="Введите возраст">
        
        <button onclick="calculate()">Рассчитать</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        // Функция для расчёта скидки в процентах
        function getDiscount(age) {
            if (age < 18) {
                return 10;  // 10% для детей до 18
            } else if (age >= 60) {
                return 20;  // 20% для пенсионеров от 60
            } else {
                return 0;   // 0% для остальных (18-59 лет)
            }
        }

        // Основная функция
        function calculate() {
            // Получаем значения из полей
            let price = document.getElementById('price').value;
            let age = document.getElementById('age').value;
            let resultDiv = document.getElementById('result');
            
            // Проверка: заполнены ли поля
            if (price === "" || age === "") {
                resultDiv.innerHTML = '<span class="error">Ошибка: введите цену и возраст</span>';
                return;
            }
            
            // Преобразуем в числа
            price = Number(price);
            age = Number(age);
            
            // Проверка: числа ли это
            if (isNaN(price) || isNaN(age)) {
                resultDiv.innerHTML = '<span class="error">Ошибка: введите корректные числа</span>';
                return;
            }
            
            // Проверка: цена не может быть отрицательной
            if (price < 0) {
                resultDiv.innerHTML = '<span class="error">Ошибка: цена не может быть отрицательной</span>';
                return;
            }
            
            // Проверка: возраст не может быть отрицательным
            if (age < 0) {
                resultDiv.innerHTML = '<span class="error">Ошибка: возраст не может быть отрицательным</span>';
                return;
            }
            
            // Получаем скидку
            let discountPercent = getDiscount(age);
            
            // Рассчитываем цену со скидкой по формуле: цена - (цена * скидка / 100)
            let finalPrice = price - (price * discountPercent / 100);
            
            // Округляем до 2 знаков (копейки)
            finalPrice = Math.round(finalPrice * 100) / 100;
            
            // Выводим результат
            if (discountPercent > 0) {
                resultDiv.innerHTML = `Итоговая цена: ${finalPrice} рублей (скидка ${discountPercent}%)`;
            } else {
                resultDiv.innerHTML = `Итоговая цена: ${finalPrice} рублей (скидка не предоставлена)`;
            }
        }
    </script>
</body>
</html>
